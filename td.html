<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>룬 가디언즈 TD</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a22; color: #e8edf2;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif; user-select: none; }
  canvas { display: block; }
  button { font-family: inherit; cursor: pointer; }
  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 18px;
    padding: 8px 14px; background: rgba(12,17,24,.82); border-bottom: 1px solid #2b3644; font-size: 15px; }
  #top .stat b { font-size: 17px; margin-left: 4px; }
  #top .gold b { color: #ffd257; }
  #top .life b { color: #ff7b7b; }
  #top .grow { flex: 1; }
  #top .next { color: #9fb0c3; font-size: 13px; }
  .btn { background: #2a3a4f; color: #e8edf2; border: 1px solid #40536b; border-radius: 6px; padding: 6px 12px; font-size: 14px; }
  .btn:hover { background: #35485f; }
  .btn.primary { background: #2f6f4a; border-color: #44956a; }
  .btn.primary:hover { background: #3a855a; }
  .btn:disabled { opacity: .45; cursor: default; }
  #build { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px;
    flex-wrap: wrap; justify-content: center; width: max-content; max-width: 98vw; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 150px 50px rgba(255,40,40,.8); }
  .card { width: 158px; background: rgba(12,17,24,.88); border: 1px solid #2b3644; border-radius: 8px;
    padding: 8px 10px; text-align: left; color: #e8edf2; }
  .card:hover { border-color: #5b7696; }
  .card.on { border-color: #ffd257; box-shadow: 0 0 0 1px #ffd257 inset; }
  .card.poor { opacity: .5; }
  .card .nm { font-size: 15px; font-weight: bold; }
  .card .cost { float: right; color: #ffd257; font-weight: bold; }
  .card .ds { font-size: 12px; color: #9fb0c3; margin-top: 4px; line-height: 1.35; }
  .card .key { font-size: 11px; color: #6f8196; }
  #sel { position: fixed; right: 12px; top: 60px; width: 220px; background: rgba(12,17,24,.9);
    border: 1px solid #2b3644; border-radius: 8px; padding: 10px 12px; display: none; font-size: 13px; }
  #sel h3 { margin: 0 0 6px; font-size: 16px; }
  #sel .row { display: flex; justify-content: space-between; padding: 2px 0; color: #c4d0dc; }
  #sel .sp { color: #9fd6a8; margin: 6px 0; line-height: 1.4; }
  #sel .acts { display: flex; gap: 8px; margin-top: 8px; }
  #sel .acts .btn { flex: 1; padding: 6px 4px; font-size: 13px; }
  #banner { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(12,17,24,.9);
    border: 1px solid #ffd257; border-radius: 8px; padding: 8px 18px; font-size: 16px; display: none; }
  .overlay { position: fixed; inset: 0; background: rgba(10,14,20,.93); display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .overlay h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 2px; }
  .overlay p { color: #9fb0c3; margin: 4px 0 18px; }
  #factions { display: grid; grid-template-columns: repeat(2, 300px); gap: 14px; }
  .fac { background: #1b2530; border: 1px solid #2f3d4e; border-radius: 10px; padding: 14px 16px; text-align: left; color: #e8edf2; }
  .fac:hover { border-color: #ffd257; background: #212d3a; }
  .fac .nm { font-size: 19px; font-weight: bold; }
  .fac .tg { font-size: 12px; margin-left: 8px; color: #9fb0c3; }
  .fac .ds { font-size: 13px; color: #b3c0cd; margin: 6px 0; line-height: 1.45; }
  .fac .rc { font-size: 12px; color: #ffd257; }
  #help { margin-top: 18px; font-size: 13px; color: #8597aa; line-height: 1.6; text-align: center; }
  #end { display: none; }
  #end .res { font-size: 16px; color: #c4d0dc; margin-bottom: 18px; line-height: 1.6; text-align: center; }
  #end .acts { display: flex; gap: 12px; }
  #loadErr { display: none; }
</style>
</head>
<body>

<div id="top">
  <span class="stat" id="facName"></span>
  <span class="stat">웨이브 <b id="wave">0</b><span id="waveMax"></span></span>
  <span class="stat gold">골드 <b id="gold">0</b></span>
  <span class="stat life">생명 <b id="lives">0</b></span>
  <span class="grow"></span>
  <span class="next" id="nextInfo"></span>
  <button class="btn" id="btnMute">소리 꺼짐</button>
  <button class="btn" id="btnAuto">자동 진행: 10초 후</button>
  <button class="btn" id="btnSpeed">배속 x1</button>
  <button class="btn primary" id="btnNext">웨이브 시작 (Space)</button>
  <button class="btn" id="btnMenu">종족 선택</button>
</div>

<div id="build"></div>

<div id="sel">
  <h3 id="selName"></h3>
  <div class="row"><span>피해</span><span id="selDmg"></span></div>
  <div class="row"><span>공격 속도</span><span id="selRate"></span></div>
  <div class="row"><span>사거리</span><span id="selRange"></span></div>
  <div class="sp" id="selSp"></div>
  <div class="acts">
    <button class="btn primary" id="btnUp"></button>
    <button class="btn" id="btnSell"></button>
  </div>
</div>

<div id="banner"></div>
<div id="hurt"></div>

<div class="overlay" id="menu">
  <h1>룬 가디언즈 TD</h1>
  <p>종족을 골라 40웨이브를 막아내세요. 30웨이브까지가 본편, 31웨이브부터는 심연 구간입니다.</p>
  <div id="factions"></div>
  <div id="help">
    왼쪽 클릭: 건설 · 타워 선택 &nbsp;|&nbsp; 오른쪽 드래그: 화면 회전 &nbsp;|&nbsp; 휠: 확대·축소<br>
    1~6: 타워 고르기 &nbsp;|&nbsp; U: 업그레이드 &nbsp;|&nbsp; M: 소리 &nbsp;|&nbsp; Space: 다음 웨이브 &nbsp;|&nbsp; F: 배속 &nbsp;|&nbsp; A: 자동 진행 &nbsp;|&nbsp; Esc: 취소
  </div>
</div>

<div class="overlay" id="end">
  <h1 id="endTitle"></h1>
  <div class="res" id="endRes"></div>
  <div class="acts">
    <button class="btn primary" id="btnRetry">같은 종족으로 다시</button>
    <button class="btn" id="btnBack">종족 선택</button>
  </div>
</div>

<div class="overlay" id="loadErr">
  <h1>불러오기 실패</h1>
  <p>3D 라이브러리를 받지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (typeof THREE === 'undefined') {
    $('menu').style.display = 'none';
    $('loadErr').style.display = 'flex';
    return;
  }

  // ---------- 기본 설정 ----------
  var COLS = 18, ROWS = 12;
  var WAYPOINTS = [[-1, 1], [15, 1], [15, 4], [2, 4], [2, 7], [15, 7], [15, 10], [18, 10]];
  var MAX_WAVE = 40, MAIN_WAVE = 30, MAX_LEVEL = 5;
  var START_GOLD = 200, START_LIVES = 20, SELL_RATE = 0.7;
  var TYPE_LABEL = { normal: '일반', fast: '고속', armored: '중장갑', swarm: '군집', boss: '보스' };

  var FACTIONS = [
    { id: 'mech', name: '기계공단', tag: '공속형', color: 0xd9a441,
      desc: '빠르게 쏘아 대는 포탑이 주력입니다. 한 발이 약해서 중장갑에 막히니 부식 분사기로 방어력을 깎아야 합니다.',
      towers: [
        { id: 'gun', name: '기관포탑', cost: 50, dmg: 6, rate: 3, range: 2.6, shape: 'gun', n: 2, len: 0.45, rad: 0.045,
          desc: '아주 빠른 연사' },
        { id: 'acid', name: '부식 분사기', cost: 90, dmg: 3, rate: 2, range: 2.4, shred: 3, shape: 'ring', accent: 0x8fd14f,
          desc: '맞은 적의 방어력 감소' },
        { id: 'hive', name: '벌집 미사일', cost: 160, dmg: 17, rate: 1.6, range: 3.2, splash: 0.9, shape: 'launcher',
          desc: '범위 피해 미사일 연사' },
        { id: 'tesla', name: '테슬라 코일', cost: 130, dmg: 10, rate: 1.5, range: 2.8, chain: 3, mode: 'beam', shape: 'coil', accent: 0x9fe8ff,
          desc: '번개가 3명에게 더 튐' },
        { id: 'haste', name: '가속 장치', cost: 140, dmg: 0, rate: 0, range: 1.9, aura: 'rate', mode: 'support', shape: 'totem', accent: 0xffe066,
          desc: '주변 타워 공속 +20%' },
        { id: 'fort', name: '가틀링 요새', cost: 260, dmg: 12, rate: 2, range: 3.0, ramp: true, shape: 'gun', n: 3, len: 0.6, rad: 0.045,
          desc: '쏠수록 빨라짐 (최대 3배)' }
      ] },
    { id: 'fire', name: '화염결사', tag: '범위형', color: 0xe2572b,
      desc: '폭발로 무리를 한꺼번에 태웁니다. 군집 웨이브에 강하고, 화상은 방어력을 무시합니다. 빠른 적은 놓치기 쉽습니다.',
      towers: [
        { id: 'orb', name: '화염구 탑', cost: 60, dmg: 14, rate: 0.9, range: 2.6, splash: 1.0, shape: 'orb', size: 0.18,
          desc: '터지며 주변까지 피해' },
        { id: 'lava', name: '용암 분출구', cost: 100, dmg: 6, rate: 1, range: 2.4, burn: 8, burnDur: 3, shape: 'ring', accent: 0xffa040,
          desc: '방어 무시 화상 3초' },
        { id: 'meteor', name: '유성 소환탑', cost: 180, dmg: 70, rate: 0.4, range: 3.6, splash: 1.5, shape: 'orb', size: 0.28,
          desc: '넓은 범위에 큰 피해' },
        { id: 'volley', name: '불화살 포대', cost: 120, dmg: 12, rate: 1.1, range: 3.0, multi: 3, shape: 'launcher',
          desc: '한 번에 3명 공격' },
        { id: 'drum', name: '전쟁 북', cost: 140, dmg: 0, rate: 0, range: 1.9, aura: 'dmg', mode: 'support', shape: 'totem', accent: 0xff7a45,
          desc: '주변 타워 피해 +20%' },
        { id: 'phoenix', name: '불사조 둥지', cost: 300, dmg: 40, rate: 0.5, range: 3.4, splash: 1.2, burn: 20, burnDur: 4, shape: 'orb', size: 0.34,
          desc: '폭발과 강한 화상' }
      ] },
    { id: 'frost', name: '서리결계', tag: '제어형', color: 0x4fb6e8,
      desc: '적을 느리게 하고 얼립니다. 화력은 평범하지만 적이 사거리에 오래 머물러 실수가 적습니다.',
      towers: [
        { id: 'arrow', name: '얼음 화살탑', cost: 55, dmg: 12, rate: 1.2, range: 2.8, slow: 0.25, slowDur: 1.5, shape: 'crystal', size: 0.2,
          desc: '맞은 적 25% 감속' },
        { id: 'aura', name: '냉기 방출기', cost: 110, dmg: 8, rate: 1, range: 2.0, slow: 0.4, slowDur: 2, mode: 'pulse', shape: 'ring', accent: 0xbfeaff,
          desc: '주변 전체 40% 감속' },
        { id: 'lance', name: '빙결 창', cost: 170, dmg: 75, rate: 0.5, range: 3.4, stun: 0.7, shape: 'crystal', size: 0.32,
          desc: '큰 피해와 잠깐 빙결' },
        { id: 'chainf', name: '서리 사슬', cost: 130, dmg: 9, rate: 1.2, range: 2.8, chain: 4, slow: 0.2, slowDur: 1.5, mode: 'beam', shape: 'coil', accent: 0xbfeaff,
          desc: '4명에게 더 튀며 감속' },
        { id: 'mark', name: '취약 수정', cost: 130, dmg: 4, rate: 1.5, range: 3.0, mark: 0.25, shape: 'crystal', size: 0.16, accent: 0xd9a8ff,
          desc: '맞은 적이 받는 피해 +25%' },
        { id: 'blizzard', name: '눈보라 제단', cost: 280, dmg: 18, rate: 0.8, range: 3.0, slow: 0.3, slowDur: 1.5, mode: 'pulse', shape: 'ring', accent: 0xe8f8ff, big: true,
          desc: '넓은 범위 전체 공격·감속' }
      ] },
    { id: 'sniper', name: '저격여단', tag: '한 방형', color: 0x8a6fd1,
      desc: '느리지만 한 발이 묵직하고 사거리가 깁니다. 보스와 중장갑에 강하고, 수가 많은 군집 웨이브에 약합니다.',
      towers: [
        { id: 'rifle', name: '장총 초소', cost: 60, dmg: 27, rate: 0.5, range: 3.6, mode: 'beam', shape: 'gun', n: 1, len: 0.7, rad: 0.04,
          desc: '긴 사거리의 단발 사격' },
        { id: 'ap', name: '철갑 저격탑', cost: 120, dmg: 55, rate: 0.45, range: 4.0, pierce: true, mode: 'beam', shape: 'gun', n: 1, len: 0.9, rad: 0.055,
          desc: '방어력 완전 무시' },
        { id: 'exec', name: '처형자', cost: 200, dmg: 145, rate: 0.3, range: 4.5, execute: true, mode: 'beam', shape: 'gun', n: 1, len: 1.15, rad: 0.065, scope: true,
          desc: '체력 절반 이하 적에게 2배' },
        { id: 'mortar', name: '박격포 진지', cost: 140, dmg: 40, rate: 0.35, range: 5.0, splash: 1.3, shape: 'mortar',
          desc: '아주 먼 거리 범위 포격' },
        { id: 'supply', name: '보급 초소', cost: 150, dmg: 0, rate: 0, range: 0, income: 20, mode: 'support', shape: 'totem', accent: 0xffd257,
          desc: '웨이브마다 골드 +20' },
        { id: 'rail', name: '레일건', cost: 320, dmg: 105, rate: 0.5, range: 5.0, pierce: true, crit: 0.25, mode: 'beam', shape: 'gun', n: 1, len: 1.3, rad: 0.08, scope: true, wide: 0.08,
          desc: '방어 무시, 25% 확률 3배' }
      ] }
  ];

  // ---------- 경로 ----------
  function tx(c) { return c - COLS / 2 + 0.5; }
  function tz(r) { return r - ROWS / 2 + 0.5; }

  var pathPts = [], segLen = [], pathLen = 0;
  var blocked = [];
  (function () {
    var i, r, c;
    for (r = 0; r < ROWS; r++) { blocked.push([]); for (c = 0; c < COLS; c++) blocked[r].push(0); }
    for (i = 0; i < WAYPOINTS.length; i++) pathPts.push(new THREE.Vector3(tx(WAYPOINTS[i][0]), 0, tz(WAYPOINTS[i][1])));
    for (i = 0; i < pathPts.length - 1; i++) {
      var l = pathPts[i].distanceTo(pathPts[i + 1]);
      segLen.push(l); pathLen += l;
      var a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
      var dc = Math.sign(b[0] - a[0]), dr = Math.sign(b[1] - a[1]);
      c = a[0]; r = a[1];
      while (true) {
        if (c >= 0 && c < COLS && r >= 0 && r < ROWS) blocked[r][c] = 1;
        if (c === b[0] && r === b[1]) break;
        c += dc; r += dr;
      }
    }
  })();

  function posAt(d, out, dir) {
    var i = 0;
    while (i < segLen.length - 1 && d > segLen[i]) { d -= segLen[i]; i++; }
    var a = pathPts[i], b = pathPts[i + 1], k = Math.min(1, d / segLen[i]);
    out.set(a.x + (b.x - a.x) * k, 0, a.z + (b.z - a.z) * k);
    if (dir) dir.set(b.x - a.x, 0, b.z - a.z);
  }

  // ---------- 장면 ----------
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  var canvas = renderer.domElement;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x18202b);
  scene.fog = new THREE.Fog(0x18202b, 60, 120);

  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
  var camTheta = 0, camPhi = 0.72, camDist = 21;
  function updateCam() {
    var sp = Math.sin(camPhi), cp = Math.cos(camPhi);
    camera.position.set(camDist * sp * Math.sin(camTheta), camDist * cp, camDist * sp * Math.cos(camTheta) + 0.6);
    camera.lookAt(0, 0, 0.6);
  }
  updateCam();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3442, 0.75));
  var sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
  sun.position.set(9, 18, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
  sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
  scene.add(sun);

  var G = {};
  function geo(key, fn) { return G[key] || (G[key] = fn()); }
  var M = {};
  function mat(color) { return M[color] || (M[color] = new THREE.MeshLambertMaterial({ color: color })); }

  (function buildBoard() {
    var under = new THREE.Mesh(new THREE.BoxGeometry(COLS + 8, 0.4, ROWS + 8), mat(0x263a2c));
    under.position.y = -0.42; under.receiveShadow = true; scene.add(under);
    var ground = new THREE.Mesh(new THREE.BoxGeometry(COLS + 0.4, 0.4, ROWS + 0.4), mat(0x4a8a55));
    ground.position.y = -0.2; ground.receiveShadow = true; scene.add(ground);

    var tileGeo = new THREE.BoxGeometry(1, 0.04, 1), tileMat = mat(0xcdb98d);
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      if (!blocked[r][c]) continue;
      var t = new THREE.Mesh(tileGeo, tileMat);
      t.position.set(tx(c), 0.012, tz(r)); t.receiveShadow = true; scene.add(t);
    }

    var pts = [], i;
    for (i = 0; i <= COLS; i++) pts.push(i - COLS / 2, 0.035, -ROWS / 2, i - COLS / 2, 0.035, ROWS / 2);
    for (i = 0; i <= ROWS; i++) pts.push(-COLS / 2, 0.035, i - ROWS / 2, COLS / 2, 0.035, i - ROWS / 2);
    var lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.13 })));

    // 입구·출구 표시
    var gateGeo = new THREE.BoxGeometry(0.25, 1.1, 0.25);
    [[-COLS / 2 - 0.2, tz(1), 0x5fd17a], [COLS / 2 + 0.2, tz(10), 0xe0605a]].forEach(function (g) {
      [-0.6, 0.6].forEach(function (off) {
        var p = new THREE.Mesh(gateGeo, mat(g[2]));
        p.position.set(g[0], 0.55, g[1] + off); p.castShadow = true; scene.add(p);
      });
    });

    // 테두리 나무
    var trunkGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.4, 6), leafGeo = new THREE.ConeGeometry(0.4, 0.95, 7);
    var spots = [[-11, -7], [-8.5, -7.6], [-3, -7.4], [2.5, -7.8], [7, -7.3], [11, -7.2], [-11.2, -2], [-11, 3], [-10.6, 7.2],
      [-5, 7.6], [0.5, 7.9], [5.5, 7.4], [10.8, 7.6], [11.3, 1], [11.1, -3.5]];
    spots.forEach(function (s, idx) {
      var k = 0.8 + (idx % 4) * 0.15;
      var tr = new THREE.Mesh(trunkGeo, mat(0x6b4a2f)); tr.position.set(s[0], 0, s[1]); tr.scale.setScalar(k); scene.add(tr);
      var lf = new THREE.Mesh(leafGeo, mat(idx % 2 ? 0x2f6b3c : 0x3a7d47)); lf.position.set(s[0], 0.6 * k, s[1]); lf.scale.setScalar(k);
      lf.castShadow = true; scene.add(lf);
    });

    gold -= cost; t.invested += cost; t.level++;

    for (i = 0; i < enemies.length; i++) {

      dx = e.mesh.position.x - x; dz = e.mesh.position.z - z;
      if (dx * dx + dz * dz <= r2 && (!best || e.dist > best.dist)) best = e;
    }
    return best;
  }

  function fire(t, target) {
    var d = t.def, s = t.stats, x = tx(t.c), z = tz(t.r), i, e, dx, dz;
    t.head.rotation.y = Math.atan2(target.mesh.position.x - x, target.mesh.position.z - z);
    t.kick = 1;
    if (d.mode === 'pulse') {
      var r2 = s.range * s.range;
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i]; if (e.dead) continue;
        dx = e.mesh.position.x - x; dz = e.mesh.position.z - z;

      ringFx(x, z, s.range, d.accent, 0.4);
      return;
    }
    if (d.mode === 'beam') {
      var col = d.accent || faction.color, px = target.mesh.position.x, pz = target.mesh.position.z;
      beamFx(x, 0.75, z, px, 0.3, pz, col, d.wide);
      flashFx(x, 0.78, z, 0.22, col, 0.1);
      sparkFx(px, 0.3, pz, col, d.wide ? 8 : 3, d.wide ? 2.4 : 1.4);
      if (d.chain) sfx('zap');
      hitEnemy(target, s, d);
      if (d.chain) chainHit(target, px, pz, s, d, col);
      return;

    var list = [target];
    if (d.multi) {

      cand.sort(function (a, b) { return b.dist - a.dist; });
      list = list.concat(cand.slice(0, d.multi - 1));
    }
    var big = d.splash && d.splash > 1.2;
    var pg = geo(big ? 'pbig' : 'psm', function () { return new THREE.SphereGeometry(big ? 0.14 : 0.07, 8, 6); });
    var pmat = geo('pm' + faction.id + (d.accent || ''), function () { return new THREE.MeshBasicMaterial({ color: d.accent || faction.color }); });
    for (i = 0; i < list.length; i++) {
      var pm = new THREE.Mesh(pg, pmat);
      pm.position.set(x, big ? 3.2 : 0.75, z);
      scene.add(pm);
      projectiles.push({ mesh: pm, target: list[i], s: s, d: d, tx: list[i].mesh.position.x, tz: list[i].mesh.position.z,
        speed: big ? 9 : (d.splash ? 9 : 15), big: big });

  function chainHit(first, px, pz, s, d, col) {

      px = best.mesh.position.x; pz = best.mesh.position.z;

  // ---------- 효과 ----------
  function ringFx(x, z, radius, color, life) {
    var m = new THREE.MeshBasicMaterial({ color: color || 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false });
    var mesh = new THREE.Mesh(geo('fxring', function () { return new THREE.RingGeometry(0.82, 1, 40); }), m);
    mesh.rotation.x = -Math.PI / 2; mesh.position.set(x, 0.08, z); mesh.scale.set(0.1, 0.1, 1);

  }

  var UP = new THREE.Vector3(0, 1, 0), bDir = new THREE.Vector3();
  function beamFx(x1, y1, z1, x2, y2, z2, color, width) {

    var m = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
    var mesh = new THREE.Mesh(geo('fxbeam', function () { return new THREE.CylinderGeometry(1, 1, 1, 6, 1, true); }), m);
    var w = width || 0.035;
    mesh.scale.set(w, len, w);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.quaternion.setFromUnitVectors(UP, bDir.divideScalar(len));
    scene.add(mesh);
    effects.push({ kind: 'beam', mesh: mesh, mat: m, t: 0, life: 0.18, w: w });
  }

  function sparkFx(x, y, z, color, count, power) {

      if (effects.length > 500) return;

      mesh.position.set(x, y, z);
      scene.add(mesh);
      effects.push({ kind: 'spark', mesh: mesh, t: 0, life: 0.35 + Math.random() * 0.3,
        vx: Math.cos(a) * sp, vy: 1.5 + Math.random() * 1.3 * power, vz: Math.sin(a) * sp });

  var textMats = {};

  function deathFx(e) {

  // ---------- 소리 ----------
  var SFX = { pop: ['triangle', 520, 180, 0.09, 0.07], boom: ['sawtooth', 160, 35, 0.6, 0.22], leak: ['square', 220, 90, 0.3, 0.1],
    build: ['sine', 330, 660, 0.12, 0.09], up: ['sine', 440, 990, 0.18, 0.09], sell: ['sine', 500, 250, 0.12, 0.07],
    wave: ['triangle', 262, 523, 0.3, 0.09], thud: ['sine', 120, 50, 0.2, 0.16], zap: ['sawtooth', 900, 300, 0.07, 0.03],
    crit: ['square', 700, 1400, 0.1, 0.05] };
  var actx = null, muted = true, sfxLast = {}, shake = 0, hurt = 0;
  function sfx(name) {
    if (muted) return;
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
      var now = actx.currentTime;
      if (sfxLast[name] !== undefined && now - sfxLast[name] < 0.05) return;
      sfxLast[name] = now;
      var P = SFX[name], o = actx.createOscillator(), g = actx.createGain();
      o.type = P[0];
      o.frequency.setValueAtTime(P[1], now); o.frequency.exponentialRampToValueAtTime(P[2], now + P[3]);
      g.gain.setValueAtTime(P[4], now); g.gain.exponentialRampToValueAtTime(0.001, now + P[3]);
      o.connect(g); g.connect(actx.destination);
      o.start(now); o.stop(now + P[3] + 0.02);
    } catch (err) {}
  }

  // ---------- 진행 ----------
  var tmpV = new THREE.Vector3(), tmpD = new THREE.Vector3(), hudDirty = false;

  function update(dt) {
    time += dt;
    var i, e, t, p;

    if (waveActive && spawnQueue.length) {
      spawnTimer -= dt;
      while (spawnTimer <= 0 && spawnQueue.length) { spawnEnemy(spawnQueue.shift()); spawnTimer += spawnGap; }
    }

    for (i = 0; i < enemies.length; i++) {
      e = enemies[i]; if (e.dead) continue;
      if (e.burnUntil > time) { damage(e, e.burnDps * dt, true); if (e.dead) continue; }
      var sp = e.speed, slowed = e.slowUntil > time, stunned = e.stunUntil > time;
      if (stunned) sp = 0; else if (slowed) sp *= (1 - e.slow);
      e.dist += sp * dt;
      if (e.dist >= pathLen) {
        removeEnemy(e);
        lives -= e.boss ? 10 : 1; hudDirty = true;
        shake = Math.max(shake, e.boss ? 0.6 : 0.25); hurt = 1; sfx('leak');
        if (lives <= 0) { lives = 0; endGame(false); return; }
        continue;
      }
      posAt(e.dist, tmpV, tmpD);
      e.mesh.position.x = tmpV.x; e.mesh.position.z = tmpV.z;
      e.mesh.rotation.y = Math.atan2(tmpD.x, tmpD.z);
      e.body.position.y = e.baseY + Math.abs(Math.sin(time * 6 + e.phase)) * 0.05;
      var hitNow = e.hitT > 0;
      if (hitNow) e.hitT -= dt;
      e.body.scale.setScalar(hitNow ? 1.16 : 1);
      e.mat.emissive.setHex(hitNow ? 0x999999 : stunned ? 0x3a8fd0 : slowed ? 0x1f4f80 : e.burnUntil > time ? 0x7a2a00
        : e.markUntil > time ? 0x5a1a7a : e.shredUntil > time ? 0x2f5a10 : 0x000000);
      var ratio = Math.max(0.01, e.hp / e.maxHp);
      e.fg.scale.x = e.bw * ratio; e.fg.center.x = 0.5 / ratio;
    }

    for (i = 0; i < towers.length; i++) {
      t = towers[i];
      if (t.float) t.float.rotation.y += dt * 1.5;
      if (t.spin) t.spin.rotation.z += dt * 2;
      if (t.kick > 0) { t.kick = Math.max(0, t.kick - dt * 8); t.head.scale.setScalar(1 + 0.2 * t.kick); }
      if (t.def.mode === 'support') continue;
      t.cd -= dt;
      if (t.cd <= 0) {
        var target = findTarget(t);
        if (target) {
          fire(t, target);
          var rate = t.stats.rate;
          if (t.def.ramp) { rate *= 1 + t.ramp; t.ramp = Math.min(2, t.ramp + 0.12); t.idle = 0; }
          t.cd = 1 / rate;
        } else {
          t.cd = 0;
          if (t.def.ramp) { t.idle += dt; if (t.idle > 0.8) t.ramp = Math.max(0, t.ramp - dt); }
        }
      }
    }

    for (i = projectiles.length - 1; i >= 0; i--) {
      p = projectiles[i];
      var ty = 0.3;
      if (p.target && !p.target.dead) { p.tx = p.target.mesh.position.x; p.tz = p.target.mesh.position.z; }
      var pos = p.mesh.position;
      var dx = p.tx - pos.x, dy = ty - pos.y, dz = p.tz - pos.z;
      var dist = Math.sqrt(dx * dx + dy * dy + dz * dz), step = p.speed * dt;
      if (dist <= step || dist < 0.05) {
        pos.set(p.tx, ty, p.tz);
        impact(p);
        scene.remove(p.mesh); projectiles.splice(i, 1);
      } else {
        pos.x += dx / dist * step; pos.y += dy / dist * step; pos.z += dz / dist * step;
      }
    }

    for (i = effects.length - 1; i >= 0; i--) {
      var f = effects[i]; f.t += dt;
      var k = f.t / f.life;
      if (k >= 1) {
        scene.remove(f.mesh); if (f.mat) f.mat.dispose(); if (f.geo) f.geo.dispose();
        effects.splice(i, 1); continue;
      }
      if (f.kind === 'ring') { var s = f.radius * (0.2 + 0.8 * k); f.mesh.scale.set(s, s, 1); f.mat.opacity = 0.8 * (1 - k); }
      else if (f.kind === 'spark') {
        f.vy -= 9 * dt;
        f.mesh.position.x += f.vx * dt; f.mesh.position.z += f.vz * dt;
        f.mesh.position.y = Math.max(0.04, f.mesh.position.y + f.vy * dt);
        f.mesh.rotation.x += dt * 9; f.mesh.rotation.y += dt * 7;
        f.mesh.scale.setScalar(Math.max(0.01, 1 - k));
      }
      else if (f.kind === 'flash') { f.mesh.scale.setScalar(f.radius * (0.3 + 0.7 * k)); f.mat.opacity = 0.9 * (1 - k); }
      else if (f.kind === 'text') { f.mesh.position.y += dt * 1.1; }
      else { f.mat.opacity = 1 - k; f.mesh.scale.x = f.mesh.scale.z = f.w * (1 - k * 0.7); }
    }

    var alive = false;
    for (i = enemies.length - 1; i >= 0; i--) { if (enemies[i].dead) enemies.splice(i, 1); else alive = true; }

    if (waveActive && !spawnQueue.length && !alive) waveCleared();
    else if (!waveActive && autoTimer > 0) {
      autoTimer -= dt; hudDirty = true;
      if (autoTimer <= 0) startWave();
    }
  }

  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
  function pick(ev) {
    mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;

    if (!ray.ray.intersectPlane(plane, hit)) return null;
    var c = Math.floor(hit.x + COLS / 2), r = Math.floor(hit.z + ROWS / 2);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    return { c: c, r: r };

  var downX = 0, downY = 0, rotating = false, rotMoved = 0, lastX = 0, lastY = 0;
  canvas.addEventListener('mousedown', function (ev) {
    if (ev.button === 0) { downX = ev.clientX; downY = ev.clientY; }
    if (ev.button === 2) { rotating = true; rotMoved = 0; lastX = ev.clientX; lastY = ev.clientY; }
  });
  window.addEventListener('mousemove', function (ev) {
    if (rotating) {
      var dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      lastX = ev.clientX; lastY = ev.clientY; rotMoved += Math.abs(dx) + Math.abs(dy);
      camTheta -= dx * 0.006;
      camPhi = Math.min(1.3, Math.max(0.2, camPhi - dy * 0.005));
      updateCam();
    }
    if (!running) return;
    var p = ev.target === canvas ? pick(ev) : null;
    hoverC = p ? p.c : -1; hoverR = p ? p.r : -1;
    refreshHover();
    if (!buildDef && selected) showRange(tx(selected.c), tz(selected.r), selected.stats.range);
  });
  window.addEventListener('mouseup', function (ev) {
    if (ev.button === 2) {
      if (rotating && rotMoved < 6 && running) { setBuild(null); select(null); }
      rotating = false; return;
    }
    if (ev.button !== 0 || ev.target !== canvas || !running) return;
    if (Math.abs(ev.clientX - downX) + Math.abs(ev.clientY - downY) > 6) return;
    var p = pick(ev);
    if (!p) { select(null); return; }
    var t = towerAt[p.r][p.c];
    if (t) { buildDef = null; hover.visible = false; select(t); updateHud(); return; }
    if (buildDef) { build(p.c, p.r); refreshHover(); return; }
    select(null);
  });
  canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  canvas.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    camDist = Math.min(40, Math.max(9, camDist + (ev.deltaY > 0 ? 1.5 : -1.5)));
    updateCam();
  }, { passive: false });

  var AUTO_WAIT = [10, 1.5, 0], AUTO_LABEL = ['10초 후', '바로', '끔'], autoMode = 0;
  function cycleAuto() {
    autoMode = (autoMode + 1) % 3;
    $('btnAuto').textContent = '자동 진행: ' + AUTO_LABEL[autoMode];
    if (running && !waveActive && wave > 0 && wave < MAX_WAVE) { autoTimer = AUTO_WAIT[autoMode]; updateHud(); }
  }

  function cycleSpeed() {
    speedMult = speedMult === 1 ? 2 : speedMult === 2 ? 3 : 1;
    $('btnSpeed').textContent = '배속 x' + speedMult;
  }

  window.addEventListener('keydown', function (ev) {
    if (!running) return;
    var k = ev.key;
    if (k.length === 1 && k >= '1' && k <= '9' && faction.towers[+k - 1]) { var d = faction.towers[+k - 1]; setBuild(buildDef === d ? null : d); }
    else if (ev.code === 'KeyM' || k === 'm' || k === 'M') toggleMute();
    else if (k === 'Escape') { setBuild(null); select(null); }
    else if (k === ' ') { ev.preventDefault(); startWave(); }
    else if (ev.code === 'KeyU' || k === 'u' || k === 'U') { if (selected) upgrade(selected); }
    else if (ev.code === 'KeyF' || k === 'f' || k === 'F') cycleSpeed();
    else if (ev.code === 'KeyA' || k === 'a' || k === 'A') cycleAuto();
  });

  $('btnNext').onclick = function () { startWave(); this.blur(); };
  $('btnSpeed').onclick = function () { cycleSpeed(); this.blur(); };
  $('btnAuto').onclick = function () { cycleAuto(); this.blur(); };
  function toggleMute() { muted = !muted; $('btnMute').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; }
  $('btnMute').onclick = function () { toggleMute(); this.blur(); };
  $('btnMenu').onclick = function () {
    if (!running || wave === 0 || confirm('진행 중인 판을 그만두고 종족 선택으로 돌아갈까요?')) showMenu();
    this.blur();
  };
  $('btnUp').onclick = function () { upgrade(selected); };
  $('btnSell').onclick = function () { sell(selected); };
  $('btnRetry').onclick = function () { startGame(faction); };
  $('btnBack').onclick = showMenu;

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- 루프 ----------
  var last = performance.now(), hudClock = 0;
  function frame(now) {
    var dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (running) {
      for (var i = 0; i < speedMult && running; i++) update(dt);
      hudClock += dt;
      if (running && (hudDirty || hudClock > 0.25)) { hudClock = 0; updateHud(); }
    }
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 1.6);
      updateCam();
      camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake;
    }
    if (hurt > 0) { hurt = Math.max(0, hurt - dt * 2.2); $('hurt').style.opacity = hurt; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  clearWorld();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
