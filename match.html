<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>궁합 · 명리서재</title>
<meta name="description" content="두 사람의 일간과 일지, 오행의 보완 관계로 궁합을 봅니다.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="명리서재">
<meta property="og:title" content="궁합 · 명리서재">
<meta property="og:description" content="두 사람의 일간과 일지, 오행의 보완 관계로 궁합을 봅니다.">
<meta property="og:url" content="https://anthd227.github.io/test-website/match.html">
<meta property="og:image" content="https://anthd227.github.io/test-website/assets/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/saju-core.js"></script>
<script src="assets/saju-data.js"></script>
<script src="assets/site.js"></script>
<style>
  .pair h2 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .pair h2 span { width: 26px; height: 26px; border-radius: 8px; background: var(--c1); color: #fff; display: grid; place-items: center; font-size: .9rem; }
  .top { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
  .vs .who b { display: block; margin-bottom: 8px; }
  .vs .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 220px; margin: 0 auto; }
  .vs .four > div { display: grid; gap: 4px; }
  .vs .four .gz b { font-size: 1.25rem; }
  .vs .four .gz span { display: none; }
  .vs .four .gz { border-radius: 10px; }
  .vs .mid { font-family: var(--serif); font-size: 1.6rem; font-weight: 900; color: var(--c1); }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; }
  .item .pt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .pt.up { color: var(--wood); } .item .pt.down { color: var(--fire); }
  .item p { grid-column: 1 / -1; }
  @media (max-width: 620px) { .top { grid-template-columns: 1fr; justify-items: start; } .vs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">이 사이트는 자바스크립트를 켜야 이용할 수 있습니다.</p></noscript>

<main class="wrap">
  <div class="page-head">
    <div class="eyebrow">宮合 · 궁합</div>
    <h1>두 사람의 궁합</h1>
    <p class="lead">일간끼리의 오행 관계, 배우자 자리인 일지의 합과 충, 서로의 부족한 오행을 채워 주는지를 함께 봅니다. 연인뿐 아니라 친구, 동료 사이에도 볼 수 있습니다.</p>
  </div>

  <div id="inputView">
    <div class="grid g2">
      <div class="card solid pair"><h2><span>甲</span>첫 번째 사람</h2><div id="formA" style="margin-top:14px"></div></div>
      <div class="card solid pair"><h2><span>乙</span>두 번째 사람</h2><div id="formB" style="margin-top:14px"></div></div>
    </div>
    <p class="small muted" style="margin:12px 0 0">태어난 시각을 알면 "시간을 모릅니다"를 풀고 입력해 주세요. 일주는 날짜만으로도 정해집니다.</p>
    <div class="msg" id="msg" style="margin-top:6px"></div>
    <button class="btn main block" id="goBtn" type="button" style="margin-top:6px">궁합 보기</button>
  </div>

  <div id="result" class="hide">
    <div class="card solid top">
      <div class="score" id="score"><div><span><b id="scoreNum"></b><small>궁합 점수</small></span></div></div>
      <div><div class="label" id="rLabel"></div><h2 id="rTitle"></h2><p id="rSummary"></p></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="vs" id="vs"></div></div>
    <div class="stack" style="margin-top:14px" id="items"></div>
    <div class="btns" style="margin-top:22px"><button class="btn" id="againBtn" type="button">다시 입력</button></div>
    <p class="small muted" style="margin-top:18px">궁합 점수는 일주를 중심으로 한 간이 계산입니다. 점수가 낮다고 인연이 아닌 것은 아니며, 서로 조심할 지점을 알려 주는 참고 자료로 봐 주세요.</p>
  </div>
</main>

<script>
(function () {
  var S = Saju, D = SajuData, U = SajuSite;
  function $(id) { return document.getElementById(id); }
  var opt = { advanced: false, requireGender: false, submit: false, unknownDefault: true };
  var fa = U.birthForm($('formA'), opt), fb = U.birthForm($('formB'), opt);
  var p = U.getProfile(); if (p) fa.set(p);
  [fa, fb].forEach(function (f) { f.form.addEventListener('submit', function (ev) { ev.preventDefault(); run(); }); });
  $('goBtn').addEventListener('click', run);
  $('againBtn').addEventListener('click', function () { $('result').classList.add('hide'); $('inputView').classList.remove('hide'); window.scrollTo(0, 0); });

  function four(r) {
    return '<div class="four">' + [3, 2, 1, 0].map(function (i) { var pp = r.pillars[i]; return '<div>' + U.gzTile('s', pp ? pp.s : null) + U.gzTile('b', pp ? pp.b : null) + '</div>'; }).join('') + '</div>';
  }
  function count(r, elIdx) { return r.elements[elIdx]; }

  function run() {
    $('msg').textContent = '';
    var a = fa.get(); if (!a) return;
    var b = fb.get(); if (!b) return;
    var ra = S.calc(a), rb = S.calc(b);
    if (ra.error) { fa.showError(ra.error); return; }
    if (rb.error) { fb.showError(rb.error); return; }
    var na = a.name || '첫 번째 사람', nb = b.name || '두 번째 사람';
    var A = ra.pillars, B = rb.pillars, items = [], score = 50;
    function add(title, pt, text) { score += pt; items.push({ title: title, pt: pt, text: text }); }

    // 일간
    var rel = S.mod(S.stemEl(B[2].s) - S.stemEl(A[2].s), 5), me = D.MATCH_EL[rel];
    add('일간의 관계 · ' + S.STEM_H[A[2].s] + S.EL[S.stemEl(A[2].s)] + ' · ' + S.STEM_H[B[2].s] + S.EL[S.stemEl(B[2].s)], me.d,
      na + '의 입장에서 ' + me.name + '입니다. ' + me.t);
    var sr = S.stemRel(A[2].s, B[2].s);
    if (sr === '합') add('일간의 합 · ' + S.STEM_H[A[2].s] + S.STEM_H[B[2].s] + ' 합', 10, '두 사람의 일간이 천간합을 이룹니다. 서로에게 자연스럽게 끌리고, 함께 있을 때 하나의 팀처럼 움직입니다.');
    if (sr === '충') add('일간의 충 · ' + S.STEM_H[A[2].s] + S.STEM_H[B[2].s] + ' 충', -5, '두 사람의 일간이 정면으로 마주 봅니다. 생각의 방향이 달라 부딪치지만, 서로에게 없는 시각을 보여 주기도 합니다.');

    // 일지
    var br = S.branchRel(A[2].b, B[2].b), used = false;
    br.forEach(function (n) { var x = D.MATCH_BR[n]; if (x) { used = true; add('일지의 관계 · ' + S.BR_H[A[2].b] + S.BR_H[B[2].b] + ' ' + n, x.d, x.t); } });
    if (!used) add('일지의 관계 · ' + S.BR_H[A[2].b] + S.BR_H[B[2].b], D.MATCH_BR['없음'].d, D.MATCH_BR['없음'].t);

    // 띠
    var yr = S.branchRel(A[0].b, B[0].b), yt = S.ANIMAL[A[0].b] + '띠와 ' + S.ANIMAL[B[0].b] + '띠';
    if (yr.indexOf('육합') >= 0 || yr.indexOf('반합') >= 0) add('띠의 관계 · ' + yt, 5, '띠가 서로 합을 이룹니다. 집안 분위기나 살아온 배경에서 통하는 면이 많습니다.');
    else if (yr.indexOf('충') >= 0) add('띠의 관계 · ' + yt, -3, '띠가 서로 충합니다. 자라 온 환경과 가치관의 차이를 인정하는 것이 필요합니다.');
    else if (yr.indexOf('원진') >= 0) add('띠의 관계 · ' + yt, -2, '띠가 원진 관계입니다. 사소한 습관에서 거슬리는 점이 생길 수 있습니다.');
    else add('띠의 관계 · ' + yt, 2, '띠 사이에 뚜렷한 합이나 충이 없어 무난합니다.');

    // 오행 보완
    var fill = [];
    ra.lackEls.forEach(function (e) { if (count(rb, e) >= 2) fill.push(U.josa(nb, '이', '가') + ' ' + na + '에게 없는 ' + S.EL[e] + ' 기운을 채워 줍니다.'); });
    rb.lackEls.forEach(function (e) { if (count(ra, e) >= 2) fill.push(U.josa(na, '이', '가') + ' ' + nb + '에게 없는 ' + S.EL[e] + ' 기운을 채워 줍니다.'); });
    if (fill.length) add('오행의 보완', Math.min(10, fill.length * 5), fill.join(' ') + ' 서로의 빈 곳을 메워 주는 좋은 조합입니다.');
    else {
      var same = ra.manyEls.filter(function (e) { return rb.manyEls.indexOf(e) >= 0; });
      if (same.length) add('오행의 보완', -3, '두 사람 모두 ' + same.map(function (e) { return S.EL[e]; }).join('·') + ' 기운이 많습니다. 닮아서 편하지만 한쪽으로 쏠리기 쉬우니 서로 다른 취미를 가져 보는 것이 좋습니다.');
      else add('오행의 보완', 0, '오행 구성에서 서로를 특별히 채우거나 겹치는 부분이 크지 않습니다.');
    }

    score = Math.max(38, Math.min(99, score));
    $('score').style.setProperty('--p', score); $('scoreNum').textContent = score;
    var grade = score >= 88 ? ['천생연분에 가까운 궁합', '타고난 결이 잘 맞습니다. 좋은 흐름을 당연하게 여기지 않고 표현을 아끼지 않으면 더할 나위 없습니다.']
      : score >= 76 ? ['잘 어울리는 궁합', '서로에게 힘이 되는 면이 많습니다. 아래의 조심할 점만 살피면 오래 편안하게 갈 수 있습니다.']
      : score >= 64 ? ['맞춰 가는 궁합', '좋은 점과 어긋나는 점이 함께 있습니다. 다름을 고치려 하기보다 역할을 나누면 균형이 잡힙니다.']
      : ['노력이 필요한 궁합', '타고난 방식이 꽤 다릅니다. 그만큼 서로에게서 배울 것이 많으니 대화의 규칙을 정해 두면 좋습니다.'];
    $('rLabel').textContent = na + ' · ' + nb;
    $('rTitle').textContent = grade[0];
    $('rSummary').textContent = grade[1];
    $('vs').innerHTML = '<div class="who"><b>' + U.esc(na) + ' · ' + S.gzK(A[2]) + '일주</b>' + four(ra) + '</div><div class="mid">合</div><div class="who"><b>' + U.esc(nb) + ' · ' + S.gzK(B[2]) + '일주</b>' + four(rb) + '</div>';
    $('items').innerHTML = items.map(function (it) {
      return '<div class="card item"><h3>' + U.esc(it.title) + '</h3><span class="pt ' + (it.pt > 0 ? 'up' : it.pt < 0 ? 'down' : '') + '">' + (it.pt > 0 ? '+' : '') + it.pt + '</span><p>' + U.esc(it.text) + '</p></div>';
    }).join('');
    $('inputView').classList.add('hide'); $('result').classList.remove('hide'); window.scrollTo(0, 0);
  }
})();
</script>
</body>
</html>
