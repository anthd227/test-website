<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>게임 · 테스트 웹사이트</title>
<style>
  :root {
    --bg: #0b0c0f; --bg2: #16181d; --ink: #f3f4f6; --sub: #8d939e; --line: rgba(255,255,255,.1);
    --glass: rgba(255,255,255,.04); --glass2: rgba(255,255,255,.08);
    --c1: #8496ff;
    --shadow: 0 16px 44px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg: #f7f7f8; --bg2: #ffffff; --ink: #111317; --sub: #666c78; --line: rgba(17,19,23,.1);
    --glass: rgba(255,255,255,.75); --glass2: rgba(255,255,255,.95);
    --c1: #4a63f0;
    --shadow: 0 14px 36px rgba(20,25,40,.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.65; overflow-x: hidden; word-break: keep-all; overflow-wrap: anywhere;
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 22px; }

  .aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
  .aurora i { position: absolute; top: -24%; left: 50%; width: 60vw; height: 46vw; min-width: 380px; min-height: 380px; border-radius: 50%;
    transform: translateX(-50%); filter: blur(110px); opacity: .13; background: var(--c1); }

  header { position: sticky; top: 14px; z-index: 20; padding: 0 14px; }
  .bar { max-width: 1040px; margin: 0 auto; height: 58px; padding: 0 10px 0 20px; display: flex; align-items: center; justify-content: space-between;
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); box-shadow: var(--shadow); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .logo span { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); }
  .tools { display: flex; align-items: center; gap: 6px; }
  .menu { position: relative; display: flex; }
  #menuBtn { height: 38px; padding: 0 16px 0 12px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); font: inherit; font-size: .88rem; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: transform .15s; }
  #menuBtn:hover { transform: translateY(-2px); }
  #menuBtn:active { transform: scale(.94); }
  #menuBtn i { font-style: normal; font-size: 1.15rem; line-height: 1; transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  header.open #menuBtn i { transform: rotate(135deg); }
  nav { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  header.open nav { pointer-events: auto; }
  nav a { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
    font-size: .8rem; font-weight: 700; white-space: nowrap; background: var(--bg2); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 10px 26px rgba(0,0,0,.22);
    opacity: 0; visibility: hidden; transform: scale(.3); transition: transform .22s ease, opacity .18s, visibility 0s .22s, background .15s, color .15s; }
  header.open nav a { opacity: 1; visibility: visible; transform: translate(var(--x, 0), var(--y, 0));
    transition: transform .5s cubic-bezier(.34,1.56,.64,1) calc(var(--i, 0) * 45ms), opacity .2s calc(var(--i, 0) * 45ms), background .15s, color .15s; }
  header.open nav a:hover { background: var(--ink); color: var(--bg); }
  #theme { width: 38px; height: 38px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass2); cursor: pointer; display: grid; place-items: center; }

  .head { padding: 70px 0 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: .8rem; font-weight: 800; letter-spacing: .16em; color: var(--c1); }
  h1 { font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -0.04em; line-height: 1.1; margin: 6px 0 0; }
  .head p { margin: 8px 0 0; color: var(--sub); }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 11px 20px; border-radius: 12px; font-weight: 700; font-size: .93rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass); transition: transform .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.main { background: var(--ink); color: var(--bg); border-color: transparent; }

  .stage { border: 1px solid var(--line); border-radius: 22px; overflow: hidden; background: #141a22; box-shadow: var(--shadow); }
  .stage iframe { display: block; width: 100%; height: calc(100vh - 150px); min-height: 600px; border: 0; }
  .tip { color: var(--sub); font-size: .86rem; margin: 14px 4px 0; }

  footer { padding: 56px 0 40px; text-align: center; color: var(--sub); font-size: .88rem; }

  @media (max-width: 620px) {
    .bar { padding-left: 14px; height: 54px; }
    .logo em { display: none; }
    #menuBtn { height: 34px; }
    #theme { width: 34px; height: 34px; }
    .head { padding-top: 48px; }
    .stage { border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="aurora"><i></i></div>

<header>
  <div class="bar">
    <a class="logo" href="./"><span></span><em style="font-style:normal">테스트 웹사이트</em></a>
    <div class="tools">
      <div class="menu">
        <button id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><i>+</i>메뉴</button>
        <nav id="menu">
          <a href="./#about">소개</a>
          <a href="./#work">하는 일</a>
          <a href="./#list">목록</a>
          <a href="board.html">게시판</a>
          <a href="game.html">게임</a>
        </nav>
      </div>
      <button id="theme" type="button" aria-label="밝기 전환" title="밝기 전환">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">GAME</div>
      <h1>룬 가디언즈 TD</h1>
      <p>종족을 골라 40웨이브를 막아내는 타워 디펜스입니다.</p>
    </div>
    <div class="acts">
      <button class="btn main" id="full" type="button">전체 화면</button>
      <a class="btn" href="td.html" target="_blank" rel="noopener">새 창에서 열기</a>
    </div>
  </div>

  <div class="stage">
    <iframe id="game" src="td.html" title="룬 가디언즈 TD" allow="fullscreen" allowfullscreen></iframe>
  </div>
  <p class="tip">PC 화면에 맞춰 만든 게임입니다. 단축키가 먹지 않으면 게임 화면을 한 번 클릭하세요.</p>
</main>

<footer>테스트 웹사이트 · 2026</footer>

<script>
(function () {
  var root = document.documentElement, game = document.getElementById('game');

  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) root.setAttribute('data-theme', 'light');
  document.getElementById('theme').addEventListener('click', function () {
    var light = root.getAttribute('data-theme') === 'light';
    if (light) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', 'light');
    try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch (e) {}
  });

  // 메뉴 펼침
  var header = document.querySelector('header'), menuBtn = document.getElementById('menuBtn');
  document.querySelectorAll('#menu a').forEach(function (a, i, all) {
    var rad = (24 + 82 / (all.length - 1) * i) * Math.PI / 180;
    a.style.setProperty('--i', i);
    a.style.setProperty('--x', Math.round(-190 * Math.cos(rad)) + 'px');
    a.style.setProperty('--y', Math.round(190 * Math.sin(rad)) + 'px');
  });
  function setMenu(open) { header.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function (ev) { ev.stopPropagation(); setMenu(!header.classList.contains('open')); });
  document.addEventListener('click', function () { setMenu(false); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') setMenu(false); });

  // 전체 화면
  document.getElementById('full').addEventListener('click', function () {
    var fn = game.requestFullscreen || game.webkitRequestFullscreen;
    if (fn) fn.call(game); else window.open('td.html', '_blank');
    game.focus();
  });
  game.addEventListener('load', function () { game.focus(); });
})();
</script>
</body>
</html>
