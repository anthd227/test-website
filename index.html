<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트 웹사이트</title>
<style>
  body { margin: 0; min-height: 100vh; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; background: #fafafa; color: #222; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 32px; text-align: center; }
  ul { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; overflow: hidden; }
  li { border-bottom: 1px solid #eee; }
  li:last-child { border-bottom: 0; }
  li a, li span { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; color: inherit; text-decoration: none; }
  li a:hover { background: #f3f6fa; }
  li small { color: #888; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>테스트 웹사이트</h1>
  <ul>
    <li><span>첫 번째 항목 <small>설명</small></span></li>
    <li><span>두 번째 항목 <small>설명</small></span></li>
    <li><span>세 번째 항목 <small>설명</small></span></li>
  </ul>
</main>
</body>
</html>
